<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Puzzle Coach</title>
<style>
:root{
  --bg:#fff6e5; --card:#ffffff; --ink:#2b2340; --muted:#6d6585; --tile:#6c4ad6; --tile-ink:#fff;
  --ok:#2aa876; --hint:#ff9f1c; --board:#e8dfff; --btn:#2b2340; --btn-ink:#fff; --line:#e6dcc4;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1a1630; --card:#272046; --ink:#f1ecff; --muted:#a79fc4; --tile:#8e74f0; --tile-ink:#150f2b;
    --ok:#47c997; --hint:#ffb340; --board:#352d5c; --btn:#f1ecff; --btn-ink:#1a1630; --line:#3b3363;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;
  display:flex;flex-direction:column;align-items:center;gap:14px;padding:14px;min-height:100%}
h1{margin:4px 0 0;font-size:1.5rem}
.tabs{display:flex;gap:8px}
.tab{border:2px solid var(--ink);background:transparent;color:var(--ink);border-radius:999px;padding:8px 18px;font:700 1rem inherit;font-family:inherit;cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;width:min(100%,420px);display:flex;flex-direction:column;gap:12px;align-items:center}
.card h2{margin:0;font-size:1.25rem;text-align:center}
.card p{margin:0;line-height:1.5;text-align:center;font-size:1.05rem}
.dots{display:flex;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dot.on{background:var(--tile)} .dot.done{background:var(--ok)}
#board{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:8px;
  width:min(80vw,320px);aspect-ratio:1;background:var(--board);padding:8px;border-radius:16px}
.tile{border:0;border-radius:12px;background:var(--tile);color:var(--tile-ink);font:800 clamp(1.8rem,9vw,2.6rem) inherit;font-family:inherit;cursor:pointer;transition:transform .12s,background .2s}
.tile:active{transform:scale(.93)}
.tile.ok{background:var(--ok);color:#fff}
.tile.hint{background:var(--hint);color:#2b2340;animation:pulse .8s ease-in-out infinite alternate}
.tile.empty{visibility:hidden}
.tile:focus-visible,button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
@keyframes pulse{to{transform:scale(1.08)}}
.coach{display:flex;gap:10px;align-items:flex-start;background:var(--board);border-radius:14px;padding:10px 12px;width:100%;min-height:64px}
.coach .face{font-size:1.9rem;line-height:1}
.coach div{line-height:1.45}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
button.b{background:var(--btn);color:var(--btn-ink);border:0;border-radius:10px;padding:10px 16px;font:700 1rem inherit;font-family:inherit;cursor:pointer}
button.b.alt{background:transparent;color:var(--ink);border:2px solid var(--ink)}
button.b:disabled{opacity:.4;cursor:default}
.stats{display:flex;gap:18px;color:var(--muted)} .stats b{color:var(--ink);font-variant-numeric:tabular-nums}
.stars{font-size:1.6rem;min-height:1.9rem;letter-spacing:4px}
.hide{display:none!important}
@media (prefers-reduced-motion:reduce){.tile{transition:none;animation:none!important}}
</style>
</head>
<body>
<h1>Puzzle Coach</h1>
<div class="tabs" role="tablist">
  <button class="tab" role="tab" id="tabLearn" aria-selected="true">Learn</button>
  <button class="tab" role="tab" id="tabPlay" aria-selected="false">Play</button>
</div>

<div class="card">
  <div class="dots hide" id="dots"></div>
  <h2 id="title"></h2>
  <p id="text"></p>
  <div id="board" role="grid" aria-label="Number puzzle"></div>
  <div class="stats" id="stats"><span>Your moves: <b id="mv">0</b></span><span>Fewest possible: <b id="opt">–</b></span></div>
  <div class="stars" id="stars" aria-live="polite"></div>
  <div class="coach"><span class="face">🤖</span><div id="coach"></div></div>
  <div class="row" id="levels"></div>
  <div class="row">
    <button class="b" id="hintBtn">💡 Hint</button>
    <button class="b alt" id="undoBtn">↩ Undo</button>
    <button class="b alt" id="showBtn">▶ Show me</button>
    <button class="b alt hide" id="newBtn">New puzzle</button>
    <button class="b hide" id="nextBtn">Next lesson ➜</button>
  </div>
</div>

<script>
(function(){
var GOAL=[1,2,3,4,5,6,7,8,0];
var $=function(id){return document.getElementById(id)};
var st,hist,mode='learn',lesson=0,optStart=0,assisted=false,solved=false,hl=-1,auto=null,level=6;

function home(v){return v-1}
function dist(v,i){var g=home(v);return Math.abs(Math.floor(g/3)-Math.floor(i/3))+Math.abs(g%3-i%3)}
function H(s){var t=0;for(var i=0;i<9;i++)if(s[i])t+=dist(s[i],i);return t}
function isGoal(s){for(var i=0;i<9;i++)if(s[i]!==GOAL[i])return false;return true}
function nbrs(e){var r=Math.floor(e/3),c=e%3,o=[];if(r>0)o.push(e-3);if(r<2)o.push(e+3);if(c>0)o.push(e-1);if(c<2)o.push(e+1);return o}

/* The AI: IDA* search with Manhattan distance = always finds the fewest moves */
function solve(s0){
  var s=s0.slice(),path=[];
  function go(g,bound,prev){
    var f=g+H(s);if(f>bound)return f;if(isGoal(s))return -1;
    var e=s.indexOf(0),min=1e9,n=nbrs(e);
    for(var k=0;k<n.length;k++){var t=n[k];if(t===prev)continue;
      s[e]=s[t];s[t]=0;path.push(t);
      var r=go(g+1,bound,e);
      if(r===-1)return -1;
      if(r<min)min=r;
      path.pop();s[t]=s[e];s[e]=0;}
    return min;
  }
  var b=H(s);
  while(true){var r=go(0,b,-1);if(r===-1)return path.slice();b=r;}
}
function scramble(n){
  var s=GOAL.slice(),prev=-1;
  for(var i=0;i<n;i++){var e=s.indexOf(0),o=nbrs(e).filter(function(x){return x!==prev});
    var t=o[Math.floor(Math.random()*o.length)];s[e]=s[t];s[t]=0;prev=e;}
  return isGoal(s)?scramble(n):s;
}
function randomHard(){
  var a;do{a=GOAL.slice();for(var i=8;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}
    var inv=0,q=a.filter(Boolean);for(var x=0;x<q.length;x++)for(var y=x+1;y<q.length;y++)if(q[x]>q[y])inv++;
  }while(inv%2||isGoal(a));return a;
}

var LESSONS=[
 {t:'1. What is the goal?',x:'Nine squares, eight tiles, and one empty space. Put the numbers in order: 1 2 3 on top, 4 5 6 in the middle, 7 8 at the bottom.',s:function(){return GOAL.slice()},demo:true},
 {t:'2. Slide a tile',x:'Only a tile touching the empty space can slide into it. Tap tile 8 to slide it into the gap!',s:function(){return scramble(1)}},
 {t:'3. Fix it in a few moves',x:'Almost done! Every tile that is home turns green. Slide the tiles back where they belong.',s:function(){return scramble(3)}},
 {t:'4. Think before you slide',x:'Good players look ahead. Ask: which tile is far from home? Move it closer. Try to use the fewest moves. Stuck? Ask the coach for a hint!',s:function(){return scramble(8)}}
];

function say(h){$('coach').innerHTML=h}
function render(){
  var b=$('board');b.innerHTML='';
  st.forEach(function(v,i){
    var e=document.createElement('button');
    e.className='tile'+(v===0?' empty':'')+(v&&v===GOAL[i]?' ok':'')+(i===hl?' hint':'');
    e.textContent=v||'';e.setAttribute('aria-label',v?'Tile '+v:'Empty space');if(!v)e.tabIndex=-1;
    e.onclick=function(){tap(i)};b.appendChild(e);
  });
  $('mv').textContent=hist.length;
}
function begin(s,msg){
  clearInterval(auto);auto=null;st=s.slice();hist=[];assisted=false;solved=false;hl=-1;
  $('stars').textContent='';$('nextBtn').disabled=true;
  var demo=mode==='learn'&&LESSONS[lesson].demo;
  $('stats').classList.toggle('hide',demo);
  $('hintBtn').classList.toggle('hide',demo);$('undoBtn').classList.toggle('hide',demo);$('showBtn').classList.toggle('hide',demo);
  if(demo){optStart=0;$('nextBtn').disabled=false;}
  else{optStart=solve(st).length;$('opt').textContent=optStart;}
  say(msg);render();
}
function tap(i){
  if(solved||auto||(mode==='learn'&&LESSONS[lesson].demo))return;
  var e=st.indexOf(0);if(nbrs(e).indexOf(i)<0){say('That tile is not next to the empty space. Pick a tile touching the gap.');return;}
  slide(i,false);
}
function slide(i,byCoach){
  var e=st.indexOf(0);hist.push({i:i,e:e});st[e]=st[i];st[i]=0;hl=-1;render();
  if(isGoal(st))return win();
  if(!byCoach)say('Nice slide! Keep going.');
}
function win(){
  solved=true;var m=hist.length,star=assisted?0:(m<=optStart?3:(m<=optStart+4?2:1));
  $('stars').textContent=assisted?'':('⭐'.repeat(star)+'☆'.repeat(3-star));
  var txt=assisted?'The coach solved it in '+m+' moves. Now try one by yourself!':
    m<=optStart?'Perfect! You used the fewest moves possible ('+optStart+')!':
    'You solved it in '+m+' moves. The fewest possible is '+optStart+'. Press Undo and try to beat it, or start a new puzzle.';
  say('🎉 '+txt);$('nextBtn').disabled=false;
}
function explain(path){
  var t=path[0],e=st.indexOf(0),v=st[t],a=dist(v,t),c=dist(v,e);
  var left=path.length;
  var why=c<a?'Tile <b>'+v+'</b> gets closer to its home.':
    c>a?'This looks like a step back, but it makes room so other tiles can get home. Smart players do this!':
    'This keeps tile <b>'+v+'</b> on its way.';
  return 'Slide tile <b>'+v+'</b> into the gap. '+why+' From here the fewest moves is <b>'+left+'</b>.';
}
function hint(){
  if(solved||auto)return;assisted=assisted;var p=solve(st);hl=p[0];say(explain(p));render();
}
function undo(){
  if(solved||auto||!hist.length)return;var h=hist.pop();st[h.e]=st[h.i];st[h.i]=0;hl=-1;render();say('Moved back. Try a different idea!');
}
function show(){
  if(solved||auto)return;assisted=true;
  auto=setInterval(function(){
    if(isGoal(st)){clearInterval(auto);auto=null;return;}
    var p=solve(st);say(explain(p));slide(p[0],true);
  },1500);
}

/* Navigation */
function dots(){
  var d=$('dots');d.innerHTML='';
  LESSONS.forEach(function(_,i){var s=document.createElement('span');s.className='dot'+(i<lesson?' done':i===lesson?' on':'');d.appendChild(s)});
}
function showLesson(){
  var L=LESSONS[lesson];$('title').textContent=L.t;$('text').textContent=L.x;
  $('nextBtn').textContent=lesson<LESSONS.length-1?'Next lesson ➜':'Go play! 🎮';
  dots();
  begin(L.s(),L.demo?'Take a look, then tap Next lesson.':'I am your coach. Tap Hint if you want my help!');
}
function showPlay(){
  $('title').textContent='Free play';
  $('text').textContent='Pick a level. Try to solve it in the fewest moves. Stars: ⭐⭐⭐ = the fewest possible!';
  begin(level===0?randomHard():scramble(level),'Ready? I will give hints when you ask.');
}
function setMode(m){
  mode=m;clearInterval(auto);auto=null;
  $('tabLearn').setAttribute('aria-selected',m==='learn');$('tabPlay').setAttribute('aria-selected',m==='play');
  $('dots').classList.toggle('hide',m!=='learn');$('nextBtn').classList.toggle('hide',m!=='learn');
  $('newBtn').classList.toggle('hide',m!=='play');$('levels').classList.toggle('hide',m!=='play');
  if(m==='learn')showLesson();else showPlay();
}
var LV=[['Easy',5],['Medium',10],['Hard',16],['Random',0]];
LV.forEach(function(l){var b=document.createElement('button');b.className='b alt';b.textContent=l[0];
  b.onclick=function(){level=l[1];showPlay()};$('levels').appendChild(b)});
$('tabLearn').onclick=function(){setMode('learn')};
$('tabPlay').onclick=function(){setMode('play')};
$('hintBtn').onclick=hint;$('undoBtn').onclick=undo;$('showBtn').onclick=show;$('newBtn').onclick=showPlay;
$('nextBtn').onclick=function(){
  if(lesson<LESSONS.length-1){lesson++;showLesson();}else setMode('play');
};
setMode('learn');
})();
</script>
</body>
</html>
